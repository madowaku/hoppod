name: HOPPOD CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic endless simulation
        run: node --test tests/*.test.mjs
      - name: Validate module syntax
        run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:assets
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          # The STORY real-audio checks must run, not skip, in CI.
          STORY_AUDIO: required
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            output/playwright/
            output/audit/
            output/review/
