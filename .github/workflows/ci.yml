name: HOPPOD CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic endless simulation
        run: node --test tests/*.test.mjs
      - name: Validate module syntax
        run: |
          node --check public/src/engine.mjs
          node --check public/src/app.mjs
          node --check public/src/links.mjs
          node --check public/src/pod.mjs
          node --check public/src/audio.mjs
          node --check public/src/earth.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output/playwright/
