<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101f2c">
<meta name="description" content="ONE MORE HOP! A tiny capsule, an endless moon. It hops. You set the pace. Play HOPPOD and share your best.">
<title>HOPPOD | ONE MORE HOP!</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><strong>HOPPOD<span class="brand-star">✦</span></strong><span>ONE MORE HOP!</span></div>
    <div class="hud"><div><small>HOPS</small><strong id="score">0</strong></div><div><small>BEST</small><strong id="best">0</strong></div></div>
  </header>
  <nav class="mode" aria-label="Course"><span id="mode-name">DAILY MOON</span><div><button id="daily" type="button">DAILY</button><button id="free" type="button">FREE RUN</button></div></nav>
  <nav class="marker-compare" aria-label="Marker experiment modes"><span>LANDING GUIDE TEST</span><div><button id="marker-full" type="button" aria-pressed="true">A · FULL</button><button id="marker-neutral" type="button" aria-pressed="false">B · POSITION</button><button id="marker-off" type="button" aria-pressed="false">C · NONE</button></div></nav>
  <section class="play-area" aria-label="Moon course">
    <canvas id="play" width="360" height="510" aria-label="Automatic hopping. Hold this canvas or the control below for FAST; release for SLOW. Mint ring means a safe landing if you keep this speed."></canvas>
    <div id="overlay" class="overlay" data-screen="start">
      <div class="intro-mark" aria-hidden="true">✦ LUNAR DELIVERY SERVICE ✦</div>
      <h1 id="overlay-title">ONE MORE HOP!</h1>
      <div id="result-details" class="result-details" hidden><strong id="result-score">0</strong><span>HOPS <i> / </i> BEST <b id="result-best">0</b></span><small id="result-course"></small></div>
      <p id="overlay-subtitle">It hops. You set the pace.</p>
      <div class="intro-controls"><span>HOLD <b>» FAST</b></span><span>LET GO <b>· SLOW</b></span></div>
      <button id="action" class="action" type="button">LET’S HOP</button>
      <div id="share-actions" class="share-actions" hidden><button id="share" type="button">POST TO X ↗</button><button id="save" type="button">SAVE PNG ↓</button><span>Attach your PNG to X yourself.</span></div>
    </div>
  </section>
  <button id="hold" class="hold" type="button" aria-pressed="false"><span class="control-icon" aria-hidden="true">»</span><strong id="hold-state">SLOW</strong><span id="hold-instruction">HOLD TO GO FAST</span></button>
  <div class="below"><span id="marker-guide">MINT RING = SAFE AT THIS SPEED</span><button id="sound" type="button" aria-pressed="true">SOUND ON</button></div>
  <footer><span>A tiny capsule. An endless moon.</span><span>SPACE = HOLD · R = RETRY</span></footer>
</main>
<script type="module" src="./src/app.mjs"></script>
</body></html>
