<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1720">
<title>RAPIPPO | STRING VALLEY lab</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:#0b1720}
body{margin:0;color:#fff0d0;background:radial-gradient(ellipse at top,#213c46 0%,#0b1720 75%);font-family:ui-monospace,Menlo,Consolas,"Hiragino Sans","Yu Gothic",monospace;overscroll-behavior:none;min-height:100dvh}
main{width:min(460px,100%);margin:0 auto;padding:8px 10px 24px;display:flex;flex-direction:column;gap:7px}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:#b3c5c2;background:transparent;border:1px solid #405e66;border-radius:6px;min-height:36px;padding:4px 8px}
button:focus-visible{outline:3px solid #8ee6c4;outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:6px}
h1{font-size:15px;margin:0;letter-spacing:.06em}
header small{display:block;font-size:9px;color:#8fb5ad;letter-spacing:.08em;font-weight:400}
header div{display:flex;gap:4px}header button{font-size:10px;min-height:32px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stages button{font-size:10px;padding:3px 1px;line-height:1.2;min-height:40px}
.stages button[aria-current=true]{color:#101f2c;background:#e9d9b0;border-color:#e9d9b0;font-weight:700}
.stages button.cleared::after{content:" ✓";color:#8ee6c4}
.stages button[aria-current=true].cleared::after{color:#22604c}
#goal{font-size:13px;line-height:1.4;font-weight:700;margin:0;min-height:2.8em;display:flex;align-items:center}
.frame{border:1px solid #607c80;border-radius:8px;overflow:hidden;background:#101f2c;line-height:0;align-self:center;width:min(100%,calc((100dvh - 268px)*360/510));min-width:230px}
canvas{display:block;width:100%;height:auto;aspect-ratio:360/510;image-rendering:pixelated;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#outcome{font-size:12px;line-height:1.4;margin:0;min-height:2.8em;color:#c9eede;display:flex;align-items:center}
#hold{width:100%;min-height:64px;font-size:18px;font-weight:700;border:1px solid #76968f;border-bottom:4px solid #355b5c;background:#1c363f;color:#8ee6c4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#hold.active{background:#ffc38e;color:#172638;border-color:#ffc38e;border-bottom-color:#aa6647}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tools button{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.stat{background:#14262f;border-radius:6px;padding:6px 3px;text-align:center}
.stat small{display:block;color:#8fb5ad;font-size:9px}
.stat strong{font-size:14px;font-variant-numeric:tabular-nums}
details{font-size:11px;color:#a5bbbc;line-height:1.5}summary{cursor:pointer;padding:6px 0}
textarea{width:100%;height:120px;background:#0d1c25;color:#c9eede;border:1px solid #405e66;border-radius:6px;font:10px ui-monospace,Consolas,monospace}
kbd{border:1px solid #5c7188;border-radius:4px;padding:0 4px;font-family:inherit}
</style>
</head>
<body>
<main>
<header>
  <h1>STRING VALLEY<small>RAPIPPO LAB D · DEV ONLY</small></h1>
  <div><button id="sound" type="button"></button><button id="language" type="button"></button></div>
</header>
<nav class="stages" id="stages"></nav>
<p id="goal"></p>
<div class="frame"><canvas id="scene" width="360" height="510"></canvas></div>
<p id="outcome" role="status" aria-live="polite"></p>
<button id="hold" type="button"></button>
<div class="tools">
  <button id="demo" type="button"></button>
  <button id="retry" type="button"></button>
</div>
<div class="stats">
  <div class="stat"><small id="label-fast"></small><strong id="fast-seconds">0.00s</strong></div>
  <div class="stat"><small id="label-string"></small><strong id="string-state">—</strong></div>
  <div class="stat"><small id="label-landing"></small><strong id="landing-state">—</strong></div>
</div>
<details>
  <summary id="notes-title"></summary>
  <p id="notes"></p>
  <textarea id="log" readonly aria-labelledby="notes-title"></textarea>
  <button id="copy" type="button"></button>
</details>
</main>
<script type="module" src="./string-valley.mjs"></script>
</body>
</html>
